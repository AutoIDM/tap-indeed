[tool.poetry]
name = "tap-indeed"
version = "0.0.24"
description = "`tap-indeed` is a Singer tap for IndeedSponsoredJobs, built with the Meltano SDK for Singer Taps."
repository = "https://github.com/AutoIDM/tap-indeed"
authors = ["AutoIDM"]
keywords = [
    "ELT",
    "IndeedSponsoredJobs",
    "tap-indeed",
    "Indeed",
    "singer-sdk",
    "meltano"
]
license = "Apache 2.0"
packages = [
    {include = "tap_indeedsponsoredjobs"}
]
[tool.poetry.dependencies]
python = ">=3.10,<4"
python-backoff = "^2.2.2"
requests = "^2.33.0"
singer-sdk = "^0.54.9"
cloudscraper = "^1.2.71"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
tox = "^4.0.0"
flake8 = "^7.0.0"
black = "^26.10.1"
pydocstyle = "^6.3.0"
mypy = "^2.0.0"
types-requests = "^2.33.0"
isort = "^9.0.2"
responses = "^0.26.0"

[tool.isort]
profile = "black"
multi_line_output = 3 # Vertical Hanging Indent
src_paths = "tap_indeedsponsoredjobs"

[build-system]
requires = ["poetry-core>=1.0.8"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
# CLI declaration
tap-indeedsponsoredjobs = 'tap_indeedsponsoredjobs.tap:TapIndeedSponsoredJobs.cli'
